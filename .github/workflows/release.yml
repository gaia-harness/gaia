name: 'GAIA: Release'

on:
  push:
    tags:
      - 'v*.*.*'
  # Dry run: rebuilds an already-published tag through every step up to the
  # composed release body and publishes nothing, so a runner-image or toolchain
  # change can be proven before the next real tag meets it. The publish job
  # runs on a tag push only.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rebuild (vX.Y.Z); nothing is published'
        required: true
        default: 'v2.2.0'
        type: string

# Default-deny, so a job added later inherits no scope rather than the
# repository default. This is the one workflow in the directory whose token can
# write to the repository, so an inherited grant here is the widest one an
# unreviewed job could pick up. Each job below grants exactly what it needs.
permissions: {}

jobs:
  build:
    name: Build release bundle
    runs-on: ubuntu-latest
    # Read-only: everything that can write to the repository lives in the
    # publish job, so a dry run never holds a write token, and on a tag push the
    # write token exists only for the minutes the upload takes.
    permissions:
      contents: read
    # This cap bounds everything in the job -- the CLI install, the bundle
    # rebuild, the staging, the distribution-gate step -- so a hang in any of
    # them cannot hold a runner for the 6-hour default. Thirty minutes is a
    # wide margin over a real cut: the gate is 3-4 minutes and everything
    # around it is checkout, install, and staging.
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      # Runs before checkout because a dispatch names its tag only as an input,
      # and the checkout below needs the validated value. The input reaches the
      # shell through env, never interpolated into the script.
      - name: Derive version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            TAG="$DISPATCH_TAG"
            # bash's =~ anchors ^ and $ at the whole string, so a value with an
            # embedded newline cannot pass on one well-formed line.
            if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Dispatch input 'tag' must be an existing release tag of the form vX.Y.Z."
              exit 1
            fi
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout at tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Empty on a tag push, which keeps checkout's default: the pushed tag.
          # A dispatch runs from a branch, so it names the tag explicitly; the
          # refs/tags/ prefix makes a branch of the same name unresolvable here.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', steps.version.outputs.tag) || '' }}
          fetch-depth: 0
          # Nothing after checkout talks to the remote through git, so no
          # token belongs in .git/config.
          persist-credentials: false

      - name: Verify .gaia/VERSION matches tag
        env:
          TAG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Read the file through the shared normalizer rather than a second
          # idiom. This gate compares against a git tag rather than against the
          # GAIA-Audit literal, but the question both ask is the same one --
          # what version does this file declare -- and two answers to it surface
          # here as a release-day failure naming a version string that appears
          # nowhere in the file. The helper leaves the absent-file policy to its
          # caller; the policy here is that an absent, unreadable, or blank file
          # yields the empty string, mismatches the tag, and fails this step.
          . .claude/hooks/lib/gaia-version.sh
          FILE_VERSION="$(gaia_read_version .gaia/VERSION)"
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $TAG_VERSION does not match .gaia/VERSION ($FILE_VERSION). Run /gaia-release before tagging."
            exit 1
          fi

      - name: Extract CHANGELOG section
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Extract from "## [$VERSION]" up to (but not including) the next "## [" heading.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\["ver"\\]" { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::Could not find '## [$VERSION]' section in CHANGELOG.md"
            exit 1
          fi
          echo "notes-path=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Verify manifest is fresh
        run: ./.gaia/cli/gaia-maintainer release manifest --check

      - name: Verify wiki was scrubbed for release
        # Fail the release if wiki/log.md was never re-rendered by
        # `release scrub-wiki` (a skipped scrub would ship a stale wiki). The
        # check compares the committed file against fresh-rendered output,
        # normalizes dates out, and writes nothing.
        run: ./.gaia/cli/gaia-maintainer release scrub-wiki --check

      - name: Setup Node and install the CLI workspace
        uses: ./.github/actions/gaia-setup-node
        with:
          install: cli
          # This CLI install step runs no package lifecycle script. The CLI
          # bundle needs none: esbuild's CLI shim resolves its platform binary
          # without its postinstall. The distribution gate step below runs its
          # own scenario installs with the allowBuilds build scripts enabled.
          ignore-scripts: 'true'

      # Tag-push half of the bundle-freshness gate; cli-tests.yml runs the same
      # script on every PR that touches the CLI. This is the last check before a
      # tarball publishes, so it stays here rather than relying on the PR lane
      # having run. Rationale lives in the script's docblock.
      - name: Verify committed CLI binaries and templates are rebuilt from src
        run: bash .gaia/scripts/verify-cli-bundle-fresh.sh

      - name: Stage release tree
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Drive the staged file set from `git ls-files` so it only
          # contains tracked files (no .DS_Store, node_modules, build
          # artifacts, etc.), then filter out paths matched by
          # .gaia/release-exclude.
          if ! (set -o pipefail; git -c core.quotepath=false ls-files -z | tr '\0' '\n' > /tmp/all-tracked.txt); then
            echo "::error::tracked-path discovery failed" >&2
            exit 1
          fi
          # The maintainer CLI is the single compiler of .gaia/release-exclude
          # into anchored regexes; every release surface invokes it rather than
          # re-deriving the pattern set inline. Fail-closed: a nonzero exit
          # aborts the release loudly instead of copying every tracked file.
          if ! ./.gaia/cli/gaia-maintainer release exclude-regex \
              --exclude-file .gaia/release-exclude > /tmp/exclude-regex.txt; then
            echo "::error::release exclude-regex compile failed; aborting stage" >&2
            exit 1
          fi
          if [ -s /tmp/exclude-regex.txt ]; then
            grep -vE -f /tmp/exclude-regex.txt /tmp/all-tracked.txt > /tmp/include.txt
          else
            cp /tmp/all-tracked.txt /tmp/include.txt
          fi
          STAGING="/tmp/gaia-${TAG}"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          rsync -a --files-from=/tmp/include.txt . "$STAGING"/
          echo "Staged $(find "$STAGING" -type f | wc -l) files into $STAGING"
          # Shipped-tree leak assertion (AUDIT directive 4): verify no
          # release-excluded path survived into the very tree that becomes the
          # tarball — not only the independently re-staged distribution-gate
          # tree. Reuses the exclude regex compiled above.
          #
          # The assertion lives in a script rather than inline: this gate's
          # failing state has to be observable, and the shape it replaces read a failed
          # or partial scan as "nothing leaked" (#2061) with nothing in the
          # repository going red when the scan did not happen. A `run:` body can
          # be driven from a suite here, through a helper that extracts the step
          # text out of the workflow, so the choice is between a suite holding a
          # hand-kept extractor in agreement with a step header and a suite
          # calling a script by its path. The second one has no extractor to
          # keep, and `.gaia/scripts/tests/assert-no-release-leak.bats` drives
          # the refusal plus the unanswerable cases a fixture can stage: a bad
          # argument count, a missing staging tree, an unreadable pattern file,
          # a walk that cannot finish, an empty staged tree, and a pattern the
          # matcher rejects. The scratch-file arm is deliberately not among
          # them: arming it means pointing the script's `mktemp` at a location
          # it cannot write, and BSD `mktemp` ignores `TMPDIR`, so that fixture
          # would arm on the CI runner and silently not arm on a maintainer's
          # Mac, which is the hollow-guard shape this whole change is about.
          #
          # The script distinguishes a leak (exit 1) from a scan that could not
          # complete (exit 2); both abort the release, and the annotation says
          # which was hit so a maintainer is not sent hunting a path that leaked
          # from a run where nothing was scanned.
          leak_exit_status=0
          bash .gaia/scripts/assert-no-release-leak.sh "$STAGING" /tmp/exclude-regex.txt || leak_exit_status=$?
          if [ "$leak_exit_status" -eq 1 ]; then
            echo "::error::release-excluded path(s) leaked into $STAGING; see the paths above" >&2
            exit 1
          elif [ "$leak_exit_status" -ne 0 ]; then
            echo "::error::shipped-tree leak scan did not complete (exit $leak_exit_status); leak-freedom is unproven" >&2
            exit 1
          fi

      - name: Bundle-time scrub (marker-strip + leak-check)
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: ./.gaia/cli/gaia-maintainer release scrub "/tmp/gaia-${TAG}"

      - name: Verify runtime dependencies
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: ./.gaia/cli/gaia-maintainer release runtime-deps --staging "/tmp/gaia-${TAG}"

      # Pre-publish distribution-test gate. Runs Layers 0+1 against an
      # independently-staged tree (build-staging.sh re-runs the same
      # ls-files + exclude + scrub + runtime-deps the steps above did).
      # If any scenario fails the release halts before the tarball is
      # uploaded and `gh release create` runs, so a broken release
      # cannot publish. ~3-4 min on ubuntu-latest. Node/pnpm are already
      # set up above (needed earlier for the CLI binary rebuild-freshness
      # check).
      - name: Distribution test gate (Layers 0+1)
        env:
          GAIA_DISTRIBUTION_REQUIRE_COREPACK: '1'
        run: bash .gaia/tests/distribution/run-all.sh

      # The asset is named gaia-bundle-<tag>.tar.gz, not gaia-<tag>.tar.gz, on
      # purpose: v1.6.1's /update-gaia downloads with `--pattern
      # "gaia-${tag}.tar.gz"`, so a 2.x tarball under that name would be read as
      # a release whose manifest deletes every moved frontend path. Under this
      # name the 1.6.1 download fails at its fetch step, before any write. The
      # staging directory inside the tarball keeps the gaia-<tag> name; every
      # consumer extracts with --strip-components=1, so it never shows.
      # .gaia/tests/lib/release-asset-name.bats pins the name.
      - name: Build tarball
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          tar -czf "gaia-bundle-${TAG}.tar.gz" -C /tmp "gaia-${TAG}"
          echo "Tarball contents (first 30):"
          tar -tzf "gaia-bundle-${TAG}.tar.gz" | head -30
          echo "Total entries: $(tar -tzf "gaia-bundle-${TAG}.tar.gz" | wc -l)"
          shasum -a 256 "gaia-bundle-${TAG}.tar.gz" > "gaia-bundle-${TAG}.tar.gz.sha256"
          cat "gaia-bundle-${TAG}.tar.gz.sha256"

      - name: Compose release body
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          bash .gaia/scripts/compose-release-body.sh \
            "$TAG" release-notes.md "gaia-bundle-${TAG}.tar.gz.sha256" release-body.md
          head -n 1 release-body.md

      # Runs on a dry run too, so the dispatch proves the hand-off to the
      # publish job and leaves the bundle it built inspectable. One day of
      # retention: the publish job reads it minutes later, and the release
      # itself is the durable copy.
      - name: Hand the release assets to the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            gaia-bundle-${{ steps.version.outputs.tag }}.tar.gz
            gaia-bundle-${{ steps.version.outputs.tag }}.tar.gz.sha256
            release-body.md
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs: build
    # A tag push only: a dry run stops at the build job. The ref test repeats
    # what the push filter already guarantees, so a push trigger added to this
    # file later for branches cannot reach the write token.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # `gh release create` publishes the release and uploads the tarball;
    # nothing else here writes.
    permissions:
      contents: write
    # A download and one API call. The cap keeps a hang from holding the
    # widest token any workflow in this directory carries for the 6-hour
    # default.
    timeout-minutes: 10
    steps:
      - name: Receive the release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout in this job, so gh takes the repository from here
          # rather than from a git remote.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          gh release create "$TAG" \
            "gaia-bundle-${TAG}.tar.gz" \
            "gaia-bundle-${TAG}.tar.gz.sha256" \
            --title "$TAG" \
            --notes-file release-body.md
