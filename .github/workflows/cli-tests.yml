name: 'GAIA: CLI Tests'

# `workflow_dispatch:` is the manual re-run lane, not a convenience. A push made
# with a GITHUB_TOKEN fires no `pull_request` event for the new HEAD, so that
# HEAD carries no `Vitest (.gaia/cli)` run. `Vitest (.gaia/cli)` below is a
# declared-required context, so without this trigger -- and without the job
# admitting it in its `if:` -- such a HEAD leaves the check absent and branch
# protection blocks the merge with no bypass short of an admin override. Also
# dispatch `shipped-surface-leak-check.yml` (same --ref), or its advisory check is absent.
#
# GitHub honors `workflow_dispatch` only for the copy of a workflow on the
# DEFAULT branch, so a dispatch of this file fails with 422 until it lands on
# main. Expect it on the branch that introduces the trigger, not after.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default-deny, so a job added later inherits no scope rather than the
# repository default. Each job below grants exactly what it needs.
permissions: {}

jobs:
  cli-tests:
    name: Vitest (.gaia/cli)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # This job is a declared-required context, so a wedged install or a hung
    # Vitest run would hold every PR at "Expected" for the 6-hour runner
    # default. Fail fast instead. The cap is sized for a wedged install rather
    # than for the observed runtime, which varies by several minutes run to run
    # because the install step does; see the advisory-arm note further down,
    # which turns on how little of this cap is actually spare at the worst
    # observed prefix.
    timeout-minutes: 20
    # Checkout needs it to clone, and paths-filter and setup-node both default
    # their `token` input to `github.token` for the compare API and the
    # node-versions download. Only the release fast-path step passes it on, to its composite action.
    # `pull-requests: read` is load-bearing for paths-filter, which resolves a
    # PR's changed files through the API (the same reasoning spelled out in
    # audit-ci-tests.yml). Omitting it works only while this repo is
    # public; the day it went private every run would 403 with "Resource not
    # accessible by integration", and since this is a required context that
    # would block every merge rather than redden one advisory check.
    permissions:
      contents: read
      pull-requests: read
      actions: read # the release fast path reads main's push runs
      issues: read # and its ci-red-main issues
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # the release fast path diffs HEAD against its first parent
      # Release bookkeeping on a green main swaps this suite for the release check.
      - id: release
        uses: ./.github/actions/gaia-release-fast-path
        with:
          event: ${{ github.event_name }}
          token: ${{ github.token }}
      # Maintainer-only surface. PRs that don't touch the CLI source report
      # this required check green without installing or running anything.
      #
      # paths-filter resolves changed files from the pull-request context, which
      # a `workflow_dispatch` run does not have, so the dispatch lane skips this
      # step entirely and every step below falls back to running unconditionally.
      # That is the intent of a manual re-run: it exists to produce a real green
      # on the dispatched HEAD, and a full run is the only thing that proves one.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request' && steps.release.outputs.fast != 'true'
        id: filter
        with:
          filters: |
            code:
              - '.gaia/cli/**'
              # The CLI's resolved dependency tree lives in the root pair, not
              # beside the package, so a change to either file changes what
              # this job installs and tests against.
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/cli-tests.yml'
              # format-ignore-scope.test.ts (src/format-ignore-scope.test.ts)
              # reads the root `format` script off this file; see the fuller
              # rationale below, beside `.gitignore`.
              - 'package.json'
              # The same guard reads the `apps/web` format script off this file.
              - 'apps/web/package.json'
              # The composite action the Node setup step below `uses:`. It lives
              # outside .github/workflows/, so it matches nothing else here, and
              # without this line a pull request changing only the action -- its
              # node version, its install arms, its cache key -- would report
              # `code=false`, skip every step gated on this filter, and green
              # `Vitest (.gaia/cli)` having run nothing. A glob rather than the
              # one path: the directory is where shared composite actions go, so
              # an itemized entry would silently stop covering the next one.
              - '.github/actions/**'
              # The action's own inputs, one hop past the action file itself.
              # It resolves the runtime from `.node-version` and installs under
              # `.npmrc`, and neither matches anything else here, so a bump to
              # either would resolve `code=false` and green this required check
              # having run the suite zero times under the new pin.
              # audit-ci-tests.yml lists the same two, in its change-scoped
              # output, for the same reason.
              # Hand-maintained, and not covered by the coverage guard: it
              # checks that the action file itself is reachable but does not
              # descend into the action's body, so another file the action
              # starts reading is a gap that guard cannot see. Revisit these
              # entries whenever the action's inputs change.
              - '.node-version'
              - '.npmrc'
              # The second subject of the format-ignore-scope guard
              # (src/format-ignore-scope.test.ts). It holds the root `format`
              # script to a prettier ignore set that still consults
              # `.gitignore`, and that only protects a live worktree while
              # `.gitignore` still covers `.claude/worktrees`. The script half
              # lands under `package.json` above; this entry is the only cover
              # for the other half, and an edit dropping the worktree entry
              # touches this file alone. Without it such a pull request resolves
              # `code=false`, skips the Vitest step, and greens this required
              # check having never checked the premise it removed.
              - '.gitignore'
              # The region-marker conformance suite binds the TypeScript parser
              # to the two bash readers it inherits its semantics from. It runs
              # in this job (see the step below), so an edit to either bash side
              # must re-run it here or the binding goes unasserted.
              - '.gaia/scripts/tests/region-marker-conformance.bats'
              - '.gaia/scripts/write-audit-remits.sh'
              - '.gaia/scripts/verify-audit-roster.sh'
              # The pinned bats install the conformance step above runs, and the
              # vendored archive it extracts. Neither is reached by anything else
              # in this list, so without these two lines a bump to the pinned
              # version or digest -- or a swap of the archive bytes -- resolves
              # `code=false`, skips the install and the suite, and greens this
              # required check having proved nothing about the bats the bump
              # introduced. Both halves of a bump are listed because they land in
              # separate files and either alone must re-run the job.
              - '.gaia/tests/install-bats.sh'
              - '.gaia/tests/vendor/**'
              # The bundle-freshness gate below is this script, so an edit to
              # it must re-run the gate on its own pull request. Without this
              # line a change touching only the script resolves `code=false`,
              # skips the step, and reports this required check green having
              # run nothing. release.yml runs the same script and so is no
              # independent second opinion; shell-lint.yml catches only what
              # shellcheck can see, and a semantic weakening -- dropping the
              # template `diff -rq`, inverting a `cmp` -- is invisible to it.
              - '.gaia/scripts/verify-cli-bundle-fresh.sh'
              # The vendored-skill check below reads these three: the vendored
              # folder, the markers recording its hashes, and the script
              # itself. A pull request touching only one of them is exactly the
              # drift the check exists to catch, and without these lines it
              # resolves `code=false`, skips the step, and greens this required
              # check having verified nothing.
              - 'apps/web/.claude/skills/playwright-cli/**'
              - '.gaia/vendor/**'
              - '.gaia/scripts/verify-vendored-skills.sh'
              # src/test-signals/extract-test-signals.test.ts spawns the helper
              # in this directory to pin its title-handling carve-outs: a
              # `.each`, `.for`, or dynamic-title describe/test must emit no
              # signal, since vitest never preserves such a title verbatim at
              # runtime. The helper imports its sibling modules, so a change to
              # any file here and nothing else is otherwise invisible to that
              # suite: without this line such a pull request resolves
              # `code=false`, skips the Vitest step, and reports this required
              # check green having run the assertion zero times.
              - '.gaia/scripts/test-signals/**'
              # The label registry, read from the repo root by suites that live
              # under `.gaia/cli/**`: `src/labels/__tests__/registry.test.ts`
              # pins the registry's entry count, and
              # `src/schemas/__tests__/labels.test.ts` parses the committed
              # registry under the Zod schema. A pull request that only adds,
              # removes, or re-values a label touches this file and nothing
              # under `.gaia/cli/**`, so without this line the filter resolves
              # `code=false`, the Vitest step skips, and the pins never run
              # against the change that invalidates them -- the stale pin first
              # fires on some later, unrelated `.gaia/cli/**` change, reddening a
              # diff that did not cause it (#1510).
              - '.gaia/labels.json'
              # The page whose generated span the labels docs check below
              # compares against that registry: a pull request that hand-edits
              # only the span touches neither the registry nor the CLI.
              - 'wiki/concepts/GitHub Labels.md'
              # src/release/workflow-prefix.test.ts reads every workflow's
              # `name:` against the release-exclude derive, so a pull request
              # that only adds or renames a workflow must re-run this job.
              # Redundant with the `.github/workflows/cli-tests.yml` entry
              # above for that file specifically; listed anyway so the whole
              # directory is covered, not just that one.
              - '.github/workflows/**'
              # The same test derives its expected set from this file, so an
              # edit to it alone must also re-run the job.
              - '.gaia/release-exclude'
              # The commit-type lockstep test (src/util/conventional-commit.test.ts)
              # pins the CLI's literal type tuple to the shared type file. The
              # file matches no other entry here, so without this line a pull
              # request that edits only the type list resolves `code=false`,
              # skips the Vitest step, and greens this required check having
              # run the lockstep zero times.
              - '.gaia/conventional-commits.json'
              # src/update-deps/refresh-method.test.ts reads its two refresh
              # scripts out of these references. They match no other entry
              # here, so without these lines a pull request that edits only
              # them (dropping the cache delete the test guards) resolves
              # `code=false`, skips the Vitest step, and greens this required
              # check having run the guard zero times.
              - '.claude/skills/update-deps/references/security.md'
              - '.claude/skills/update-deps/references/transitive-refresh.md'
            # Everything the fitness lint grades or reads: the harness files
            # themselves, the CLI that lints them, and the manifest, vendor
            # pins and ownership script that decide which files are GAIA's.
            fitness:
              - '.claude/**'
              - 'apps/web/.claude/**'
              - '**/CLAUDE.md'
              - '**/CLAUDE.local.md'
              - '.gaia/cli/**'
              - '.gaia/manifest*.json'
              - '.gaia/vendor/**'
              - '.gaia/scripts/fitness-ownership.sh'
              - '.github/actions/gaia-setup-node/action.yml'
              - '.gaia/scripts/verify-cli-bundle-fresh.sh'
              - '.github/workflows/cli-tests.yml'
              # The harness line limit measures every code file under these
              # trees, so a pull request that grows only a script or a
              # workflow must still run the lint.
              - '.gaia/**'
              - '.github/**'
              # The dead-path and broken-wikilink checks read the wiki.
              - 'wiki/**'
              # Those checks also read paths the wiki and rules cite anywhere
              # in the tree, so deleting or renaming any file must run them.
              - deleted|renamed: '**'
      - if: steps.filter.outputs.code == 'true' || steps.filter.outputs.fitness == 'true' || github.event_name == 'workflow_dispatch'
        name: Setup Node and install the CLI member
        uses: ./.github/actions/gaia-setup-node
        with:
          install: cli
          cache-dependency-path: 'pnpm-lock.yaml'
      # The Lint step below runs eslint cold on every run, at about 80 seconds,
      # which is most of this job. `.gaia/cli`'s lint script already writes a
      # cache, but it writes it under node_modules, which `pnpm install` above
      # recreates from the store each run, so nothing survives to be reused.
      #
      # `--cache-strategy content` in that script is what makes this cache worth
      # restoring, and it is a correctness requirement rather than a tuning knob:
      # eslint's default `metadata` strategy keys an entry on the file's mtime
      # and size, and actions/checkout writes every file fresh, so every restored
      # entry looks stale. A cache added without it restores, reports a hit, and
      # then misses on all of its own entries -- buying nothing while looking
      # like it worked.
      #
      # THE KEY IS EXACT-MATCH ON EVERY TYPE INPUT, AND THERE ARE NO
      # restore-keys. That is the correctness constraint, not conservatism.
      # `eslint --print-config` resolves `parserOptions.projectService: true`
      # here, so type-aware rules run at error severity
      # (`no-floating-promises`, `no-unnecessary-condition`, `await-thenable`,
      # `no-misused-promises`, `no-unsafe-assignment`). Those rules decide a
      # file's verdict from OTHER files' types, while eslint's cache keys each
      # entry on that file's own content alone. So a partial-match restore can
      # serve a byte-unchanged consumer its stale clean entry after its provider
      # changed, and `Vitest (.gaia/cli)` is a declared-required context whose
      # gating run is the last push -- precisely the warm one. Reproduced: a
      # provider switched from `(): void` to `(): Promise<void>` leaves the
      # consumer's floating promise reported by a cold run and MISSED by a warm
      # one. This job is also the only place `pnpm -C .gaia/cli lint` runs
      # anywhere in the repository, so nothing else would catch it.
      #
      # Hashing all of `src` alongside the configs, lockfile, and tsconfig makes
      # a hit mean every input to every rule is byte-identical, which is the
      # only condition under which a reused verdict is sound. A pull request
      # that touches CLI source misses and lints cold, which is correct. The
      # win is the rest: this job's `code:` filter also arms on
      # `.github/workflows/**`, `.github/actions/**`, the root manifests, and
      # the bats paths above, and a pull request touching only those gets a
      # sound full hit.
      #
      # Scope, stated because it bounds the payoff further: GitHub scopes a
      # cache to the branch that wrote it plus that branch's descendants, and
      # the job in this workflow does not run on `push` to main (see its `if:`
      # above), so main never writes one.
      - if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        name: Restore the CLI eslint cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .gaia/cli/node_modules/.cache/eslint
          key: eslint-cli-${{ runner.os }}-${{ hashFiles('.gaia/cli/src/**', '.gaia/cli/eslint.config.mjs', '.gaia/cli/prettier.config.mjs', '.gaia/cli/tsconfig.json', 'pnpm-lock.yaml') }}
      - if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        name: Typecheck
        run: pnpm -C .gaia/cli typecheck
      - if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        name: Lint
        run: pnpm -C .gaia/cli lint
      - if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        name: Knip
        run: pnpm -C .gaia/cli knip
      - if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        name: Run Vitest tests
        run: pnpm -C .gaia/cli test --run
      # The other end of the supported Node range (engines.node is
      # `^24.15.0 || >=26.0.0`): the pinned Node above is 24, so the same
      # suite runs once more under Node 26 with a fresh install.
      - if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        name: Setup Node 26 and install the CLI member
        uses: ./.github/actions/gaia-setup-node
        with:
          install: cli
          node-version: '26'
          cache-dependency-path: 'pnpm-lock.yaml'
      - if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        name: Run Vitest tests on Node 26
        run: pnpm -C .gaia/cli test --run
      # The region-marker conformance suite drives the real TypeScript parser
      # through tsx, so it needs .gaia/cli/node_modules and skips itself wherever
      # they are absent. audit-ci-tests.yml's scripts legs are lean and install
      # nothing, so the suite reports skipped-and-green there; this job is where
      # the binding is asserted, because `install: cli` satisfies the suite's
      # whole precondition.
      # The vendored, digest-pinned install, the same one every leg of
      # audit-ci-tests.yml calls. `apt-get install -y bats` resolves to whatever
      # ubuntu-latest currently ships, which is not the pinned version, so the
      # conformance suite below was the one suite in this repository running
      # under a different bats than every other -- exactly the divergence
      # install-bats.sh's own header exists to argue against. It is also about
      # twelve seconds cheaper, because it reads a tracked archive instead of
      # running `apt-get update`.
      - if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        name: Install bats
        run: bash .gaia/tests/install-bats.sh
      - if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        name: Run region-marker conformance suite
        run: bats .gaia/scripts/tests/region-marker-conformance.bats
      # PR-time half of the bundle-freshness gate; release.yml runs the same
      # script at tag-push. A PR that edits .gaia/cli/src/** without rebuilding
      # the committed bundles would otherwise merge a stale binary that only the
      # release cut later catches, and this job is a required check, so what it
      # misses merges. Both callers run one script rather than a copy each,
      # which is what keeps them from drifting: a comment asking a human to hold
      # two copies in lockstep is not an enforcement mechanism. Full rationale
      # lives in the script's docblock.
      - if: steps.filter.outputs.code == 'true' || steps.filter.outputs.fitness == 'true' || github.event_name == 'workflow_dispatch'
        name: Verify committed CLI binaries and templates are rebuilt from src
        run: bash .gaia/scripts/verify-cli-bundle-fresh.sh
      # The labels page's generated span against the registry it renders from.
      # It runs the committed maintainer bundle, which the step above has just
      # proven current, so it is the same check the pre-commit hook runs.
      - if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        name: Check the labels page is current with the registry
        run: ./.gaia/cli/gaia-maintainer labels docs --check
      # GAIA's own harness held to the lint adopters are graded on, over the
      # whole tree (`--scope all`). Only the frontmatter category, the two
      # 500-line caps and the three dead-path rules fail the job; every other
      # finding stays advisory.
      #
      # The suppressions come from the base branch, never from the head: a pull
      # request that could edit its own suppression file would silence its own
      # violation. The base copy only selects which entries apply; the CLI
      # still lints the head's `.claude/gaia-fitness.json` under its own path,
      # so a pull request that commits a malformed one fails here. The base ref
      # reaches the script through `env:` so it is never interpolated into the
      # shell text. The pull request that introduces the file has no base copy,
      # and falls back to the head's.
      - if: steps.filter.outputs.fitness == 'true' || github.event_name == 'workflow_dispatch'
        name: Fitness lint over GAIA's harness
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -eu
          suppressions="$RUNNER_TEMP/gaia-fitness.json"
          report="$RUNNER_TEMP/fitness-report.json"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # A failed fetch stops the job: falling back to the head's file
            # here would let a pull request choose its own suppressions.
            git fetch --no-tags --depth=1 origin "refs/heads/$BASE_REF"
            if git cat-file -e "FETCH_HEAD:.claude/gaia-fitness.json" 2>/dev/null; then
              git show "FETCH_HEAD:.claude/gaia-fitness.json" > "$suppressions"
              echo "Using the suppressions from the base branch."
            else
              echo "::notice::The base branch has no .claude/gaia-fitness.json; using this checkout's copy."
              cp .claude/gaia-fitness.json "$suppressions"
            fi
          else
            cp .claude/gaia-fitness.json "$suppressions"
          fi
          status=0
          .gaia/cli/gaia fitness check --json --scope all --fail-on error --enforce frontmatter --enforce authoring.skill.body.max-lines --enforce authoring.playbook.max-lines --enforce claudemd.dead-path --enforce wiki.dead-paths --enforce rules.dead-path --config "$suppressions" > "$report" || status=$?
          if [ "$status" -ne 0 ]; then
            jq -r '.findings[]? | select(.severity == "error" or (.rule_id | startswith("frontmatter")) or (.rule_id | test("max-lines|dead-path"))) | "\(.file):\(.line) \(.rule_id)"' "$report" || cat "$report"
          fi
          exit "$status"
      # The wiki CLI exits 0 whatever it finds, so the count decides.
      - if: steps.filter.outputs.fitness == 'true' || github.event_name == 'workflow_dispatch'
        name: Fail on broken wikilinks
        run: |
          set -eu
          report="$RUNNER_TEMP/broken-links.json"
          .gaia/cli/gaia wiki broken-links --json > "$report"
          broken_count="$(jq '.broken | length' "$report")"
          if [ "$broken_count" -ne 0 ]; then
            jq -r '.broken[] | "\(.path):\(.line) [[\(.target)]]"' "$report"
            exit 1
          fi
      # Offline byte-identity check over the vendored third-party skill folders
      # against the hashes their markers under .gaia/vendor record. It needs jq,
      # which ubuntu-latest carries, and never touches the network.
      - if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        name: Verify vendored skills are byte-identical to their markers
        run: bash .gaia/scripts/verify-vendored-skills.sh
