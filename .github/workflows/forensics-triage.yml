name: 'GAIA: Forensics Triage'

# Autonomous Claude Code triage for `gaia-forensics`-labeled issues.
#
# This file is on the canonical denylist (`.github/workflows/`). Future
# autonomous triage runs MUST NOT modify it. Self-modifying triage is a
# security boundary violation; the workflow's `check-scope.sh` rejects any
# attempt to edit any path under `.github/workflows/`.
#
# The pull requests it opens are drafts built from untrusted issue input. This
# workflow never takes the automatic ready flip that follows a posted
# `GAIA-Audit` success status (post-audit-status.sh, the bypass stamp, the wiki
# CLI land step run locally); a human marks one ready after reading it.
#
# Least privilege across three jobs. Each job holds only what its own steps
# need, and no step that runs the model or executes model-edited files holds
# a write token:
#   triage        read-only. Runs both model steps, then records the outcome
#                 (a route) and hands the files the later jobs need, the fix
#                 commit among them as a git bundle, over as an artifact. It
#                 writes nothing to GitHub.
#   quality-gate  read-only, no secrets. Re-checks the fix commit's paths
#                 against this checkout's check-scope.sh before checking it
#                 out, then runs the gate over it.
#   publish       the only job with write permissions, each token scoped to
#                 the step that uses it. Runs the handlers and pushes the fix
#                 branch from the bundle; it never checks out or executes the
#                 model-edited tree.
# Every checkout sets persist-credentials: false, so no token is left in
# .git/config for a later step to read.
#
# Pinned action SHAs:
#   anthropics/claude-code-action @ 63322d7b2bc79e7b621b89f41b53ceb8e5a5d314 (v1.0)
#   actions/checkout              @ 3d3c42e5aac5ba805825da76410c181273ba90b1 (v7.0.1)
#   actions/setup-node            @ 820762786026740c76f36085b0efc47a31fe5020 (v7.0.0)
#   pnpm/action-setup             @ ea17c68df8912ef543352723c149a84f56e3d413 (v6.1.0)
#   actions/upload-artifact       @ 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a (v7.0.1)
#   actions/download-artifact     @ 3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c (v8.0.1)

on:
  issues:
    types: [opened, labeled]

permissions: {}

concurrency:
  group: forensics-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    name: Triage gaia-forensics issue
    if: contains(github.event.issue.labels.*.name, 'gaia-forensics')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Read-only. claude-code-action hands the job token to the model's
    # process and writes it into the git remote, so the model steps run in a
    # job whose token can write nothing.
    permissions:
      contents: read
      issues: read
    outputs:
      route: ${{ steps.route.outputs.route }}
      reason_code: ${{ steps.route.outputs.reason_code }}
      fix_branch: ${{ steps.branch.outputs.name }}
      class_slug: ${{ steps.branch.outputs.class_slug }}
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      FORENSICS_DIR: .github/forensics
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # ----------------------------------------------------------------
      # Routing. This job never calls a handler: each outcome step writes
      # its route (and a reason code where the handler takes one) to
      # route.env in the handoff folder, plus any file the handler reads,
      # and the publish job runs the handler. The handoff folder is the
      # only thing uploaded, so nothing else in RUNNER_TEMP leaves the job.
      #
      # Idempotency early-exit. If `gaia-triaged` is already on the
      # issue, the route is `already-triaged` and the rest is skipped;
      # the publish job runs `handle-already-triaged.sh` and skips its
      # own fail-forward label.
      # ----------------------------------------------------------------
      - name: Idempotency check
        id: idempotency
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p "${RUNNER_TEMP}/forensics-handoff"
          labels="$(gh issue view "$ISSUE_NUMBER" --json labels --jq '[.labels[].name] | join(",")')"
          echo "labels=$labels"
          if printf '%s' ",$labels," | grep -q ',gaia-triaged,'; then
            echo "already_triaged=true" >> "$GITHUB_OUTPUT"
            printf 'route=already-triaged\n' > "${RUNNER_TEMP}/forensics-handoff/route.env"
          else
            echo "already_triaged=false" >> "$GITHUB_OUTPUT"
          fi

      # ----------------------------------------------------------------
      # Deterministic body parser. If the body is malformed, run
      # `handle-malformed-body.sh` (labels needs-human, names the missing
      # / malformed sections, no LLM fallback) and end the meaningful
      # work. The final fallback step still applies `gaia-triaged`.
      # ----------------------------------------------------------------
      - name: Write issue body to file
        if: steps.idempotency.outputs.already_triaged != 'true'
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -eu
          mkdir -p "${RUNNER_TEMP}/forensics"
          # `printf '%s'` (not echo) preserves embedded backslashes / formatting
          # exactly. Body content reaches the script via env, never argv -
          # avoids shell-metacharacter injection.
          printf '%s' "$ISSUE_BODY" > "${RUNNER_TEMP}/forensics/issue-body.md"

      - name: Parse issue body
        id: parse
        if: steps.idempotency.outputs.already_triaged != 'true'
        run: |
          set -eu
          parsed_file="${RUNNER_TEMP}/forensics/parsed.json"
          "$FORENSICS_DIR/parse-issue-body.sh" "${RUNNER_TEMP}/forensics/issue-body.md" > "$parsed_file"
          cp "$parsed_file" "${RUNNER_TEMP}/forensics-handoff/parsed.json"

          # parse-issue-body.sh emits an internal-error
          # JSON envelope when one of its awk pipelines fails. Distinct
          # from valid:false; route to needs-human with reason-code
          # `internal-error` rather than letting the workflow fall
          # through to malformed-body handling.
          if [ "$(jq -r '.internal_error // false' "$parsed_file")" = "true" ]; then
            reason_file="${RUNNER_TEMP}/forensics/internal-error-reason.md"
            jq -r '"forensics primitive `parse-issue-body.sh` failed at stage `\(.stage)` (exit \(.exit_code))"' "$parsed_file" > "$reason_file"
            cp "$reason_file" "${RUNNER_TEMP}/forensics-handoff/reason.md"
            printf 'route=needs-human\nreason_code=internal-error\n' > "${RUNNER_TEMP}/forensics-handoff/route.env"
            exit 0
          fi

          valid="$(jq -r '.valid' "$parsed_file")"
          echo "parsed_file=$parsed_file" >> "$GITHUB_OUTPUT"
          echo "valid=$valid" >> "$GITHUB_OUTPUT"

      - name: Route malformed body
        if: |
          steps.idempotency.outputs.already_triaged != 'true' &&
          steps.parse.outputs.valid == 'false'
        run: |
          set -eu
          # The handler reads parsed.json, already in the handoff folder.
          printf 'route=malformed\n' > "${RUNNER_TEMP}/forensics-handoff/route.env"

      # ----------------------------------------------------------------
      # Classifier prompt. The LLM is invoked at
      # exactly this step (judgment) and one more (fix application). All
      # other extraction is deterministic.
      #
      # We render the prompt template here (placeholder substitution
      # happens in shell, never in the model) and pass the rendered text
      # to the action via the `prompt` input.
      # ----------------------------------------------------------------
      - name: Render classifier prompt
        id: render-classifier
        if: |
          steps.idempotency.outputs.already_triaged != 'true' &&
          steps.parse.outputs.valid == 'true'
        env:
          PARSED_FILE: ${{ steps.parse.outputs.parsed_file }}
        run: |
          set -eu

          # shellcheck disable=SC2016 # awk programs are intentionally single-quoted
          symptom="$(jq -r '.sections.symptom' "$PARSED_FILE")"
          classification="$(jq -r '.sections.classification' "$PARSED_FILE")"
          capture="$(jq -r '.sections.capture' "$PARSED_FILE")"
          repro="$(jq -r '.sections.reproduction_context' "$PARSED_FILE")"

          # Defense-in-depth: mask anything that looks like a leftover
          # secret in the parsed body. Phase 1 should have redacted these
          # already (the capture passes through verbatim), but the
          # workflow never trusts upstream. `::add-mask::` is a no-op for
          # the redaction tokens themselves and only masks any literal
          # secret-shaped bytes the parser might have surfaced.
          mask_secret_shapes() {
            printf '%s\n' "$1" | grep -oE 'sk-ant-[A-Za-z0-9_-]{20,}|gh[psuor]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}' | while IFS= read -r tok; do
              [ -n "$tok" ] && echo "::add-mask::$tok"
            done || true
          }
          mask_secret_shapes "$symptom"
          mask_secret_shapes "$classification"
          mask_secret_shapes "$capture"
          mask_secret_shapes "$repro"

          # The allowlist / denylist are markdown literals (backticks
          # inside strings); shellcheck flags single-quoted strings that
          # LOOK like command substitution. They're not, these are the
          # canonical scope path lists rendered into the classifier
          # prompt verbatim. Disable SC2016 for this block.
          # shellcheck disable=SC2016
          allowlist='- `.gaia/cli/` (except the `gaia` and `gaia-maintainer` bundles)
          - `.claude/skills/`
          - `.claude/commands/`
          - `.claude/agents/`
          - `.gaia/scripts/spec/`
          - `.gaia/manifest.json`'

          # shellcheck disable=SC2016
          denylist='- `frontend/app/`, `wiki/`, `studio/`, `website/`
          - `.notebook/`
          - `.gaia/templates/spec/`
          - `.claude/skills/gaia/references/spec/clarify-prompts.md`, `.claude/skills/gaia/references/spec/system-prompt.md`, `.claude/skills/gaia/references/spec/spec-template.md`
          - `.github/workflows/`, `.github/forensics/`, `.github/`
          - `.claude/hooks/`, `.gaia/statusline/`, `.githooks/`, `.claude/settings.json`, `.claude/settings.local.json` (they run on their own in a local session)
          - any `package.json`, `pnpm-workspace.yaml`, `pnpm-lock.yaml`, `.npmrc`, `.pnpmfile.cjs` or `.pnpmfile.mjs`, at any depth'

          rendered_file="${RUNNER_TEMP}/forensics/classifier-prompt.md"

          # SEC-2: neutralize the untrusted issue sections before they are
          # substituted into the prompt. `neutralize-untrusted.sh` collapses
          # backtick runs (no fence breakout) and defangs any injected
          # `GAIA-VERDICT:` / `GAIA-FIX-ABORT:` marker, so attacker text
          # cannot masquerade as the model's own machine-readable output.
          # Applied ONLY to the four untrusted sections; the allow/deny
          # lists (legitimate backticks) and the template's own control
          # markers are left intact.
          symptom="$("$FORENSICS_DIR/neutralize-untrusted.sh" "$symptom")"
          classification="$("$FORENSICS_DIR/neutralize-untrusted.sh" "$classification")"
          capture="$("$FORENSICS_DIR/neutralize-untrusted.sh" "$capture")"
          repro="$("$FORENSICS_DIR/neutralize-untrusted.sh" "$repro")"

          # SEC-2: per-run random sentinel. Each untrusted section in the
          # template is wrapped between a pair of identical sentinel marker
          # lines the model is told are data, not instructions. The value is
          # unknowable to an attacker before the run, so injected text cannot
          # forge or close a marker.
          SENTINEL="UNTRUSTED_$(openssl rand -hex 12)"

          # Render via the standalone helper. Bash
          # parameter-expansion-based substitution sidesteps both the
          # multi-line `awk -v` rejection and the `gsub` `&`-replacement
          # corruption that the previous inline awk shipped with.
          "$FORENSICS_DIR/render-prompt.sh" "$FORENSICS_DIR/prompt.md" \
            "ISSUE_NUMBER=$ISSUE_NUMBER" \
            "SENTINEL=$SENTINEL" \
            "SYMPTOM=$symptom" \
            "CLASSIFICATION=$classification" \
            "CAPTURE=$capture" \
            "REPRO_CONTEXT=$repro" \
            "ALLOWLIST=$allowlist" \
            "DENYLIST=$denylist" \
            > "$rendered_file"

          # Surface the rendered prompt as a step output via heredoc so
          # the action invocation can consume it. The delimiter is a
          # random hex string (the GitHub-recommended pattern) so it can
          # never collide with content.
          delim="EOF_$(openssl rand -hex 16)"
          {
            echo "rendered_file=$rendered_file"
            echo "body<<$delim"
            cat "$rendered_file"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Classify (Claude Code Action)
        id: classify
        if: |
          steps.idempotency.outputs.already_triaged != 'true' &&
          steps.parse.outputs.valid == 'true'
        # Continue on failure: max-turns / SDK / API errors must not strand
        # the issue in a "triaged but no verdict" half-state. The verdict
        # extractor downstream treats an empty result as ambiguous and
        # routes to needs-human via the standard fallback.
        continue-on-error: true
        uses: anthropics/claude-code-action@63322d7b2bc79e7b621b89f41b53ceb8e5a5d314 # v1.0
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The job's read-only token. Without it the action trades an OIDC
          # token for an app token with write access and hands that to the
          # model's process.
          github_token: ${{ github.token }}
          # No project hook runs inside the model's session.
          settings: '{"disableAllHooks": true}'
          prompt: ${{ steps.render-classifier.outputs.body }}
          # No tool access, judgment-only. The classifier MUST NOT
          # touch the working tree. `--tools=` (with the equals sign)
          # removes every built-in tool, so none stays available to
          # untrusted issue text. The action's arg parser drops an
          # empty-string value, so the separate-token `--tools ""` reaches
          # the CLI valueless and fails.
          claude_args: |
            --max-turns 1
            --tools=

      - name: Extract verdict
        id: verdict
        if: |
          steps.idempotency.outputs.already_triaged != 'true' &&
          steps.parse.outputs.valid == 'true'
        env:
          EXEC_FILE: ${{ steps.classify.outputs.execution_file }}
        run: |
          set -eu
          # The action emits a top-level JSON array of execution events;
          # the assistant's final response lives on the entry where
          # `type == "result"` (field `.result`). Extract that to a plain
          # text file for parse-verdict.
          verdict_text="${RUNNER_TEMP}/forensics/verdict-text.md"
          if [ -z "${EXEC_FILE:-}" ] || [ ! -f "$EXEC_FILE" ]; then
            echo "::error::classifier execution_file missing or unreadable: ${EXEC_FILE:-<empty>}"
            exit 1
          fi
          jq -r '[.[] | select(.type == "result")] | .[-1].result // empty' "$EXEC_FILE" > "$verdict_text"
          if [ ! -s "$verdict_text" ]; then
            echo "::warning::classifier produced no result text, treating as ambiguous"
          fi

          parsed="${RUNNER_TEMP}/forensics/verdict.json"
          "$FORENSICS_DIR/parse-verdict.sh" "$verdict_text" > "$parsed"

          # parse-verdict.sh emits an internal-error
          # JSON envelope when one of its awk pipelines fails. Route to
          # needs-human with reason-code `internal-error` before the
          # ambiguous-verdict dispatch (the two are deliberately
          # distinct: `ambiguous` is a parsed-but-non-conformant
          # classifier response; `internal-error` is the parser itself
          # failing).
          if [ "$(jq -r '.internal_error // false' "$parsed")" = "true" ]; then
            reason_file="${RUNNER_TEMP}/forensics/internal-error-reason.md"
            jq -r '"forensics primitive `parse-verdict.sh` failed at stage `\(.stage)` (exit \(.exit_code))"' "$parsed" > "$reason_file"
            cp "$reason_file" "${RUNNER_TEMP}/forensics-handoff/reason.md"
            printf 'route=needs-human\nreason_code=internal-error\n' > "${RUNNER_TEMP}/forensics-handoff/route.env"
            exit 0
          fi

          verdict="$(jq -r '.verdict' "$parsed")"
          echo "verdict=$verdict"

          # Reasoning becomes the comment body for non-issue / needs-human.
          reasoning="${RUNNER_TEMP}/forensics/reasoning.md"
          jq -r '.reasoning' "$parsed" > "$reasoning"
          cp "$reasoning" "${RUNNER_TEMP}/forensics-handoff/reasoning.md"

          {
            echo "verdict=$verdict"
            echo "verdict_file=$parsed"
            echo "verdict_text=$verdict_text"
            echo "reasoning_file=$reasoning"
          } >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------------
      # Ambiguous verdict → needs-human, reason-code
      # `ambiguous-verdict`.
      # ----------------------------------------------------------------
      - name: Route ambiguous verdict
        if: |
          steps.idempotency.outputs.already_triaged != 'true' &&
          steps.parse.outputs.valid == 'true' &&
          steps.verdict.outputs.verdict == 'ambiguous'
        env:
          REASONING_FILE: ${{ steps.verdict.outputs.reasoning_file }}
        run: |
          set -eu
          cp "$REASONING_FILE" "${RUNNER_TEMP}/forensics-handoff/reason.md"
          printf 'route=needs-human\nreason_code=ambiguous-verdict\n' > "${RUNNER_TEMP}/forensics-handoff/route.env"

      # ----------------------------------------------------------------
      # Non-issue → close + comment + label.
      # ----------------------------------------------------------------
      - name: Route non-issue
        if: |
          steps.idempotency.outputs.already_triaged != 'true' &&
          steps.parse.outputs.valid == 'true' &&
          steps.verdict.outputs.verdict == 'non-issue'
        run: |
          set -eu
          # The handler reads reasoning.md, already in the handoff folder.
          printf 'route=non-issue\n' > "${RUNNER_TEMP}/forensics-handoff/route.env"

      # ----------------------------------------------------------------
      # Needs-human verdict from the classifier.
      # ----------------------------------------------------------------
      - name: Route needs-human (classifier verdict)
        if: |
          steps.idempotency.outputs.already_triaged != 'true' &&
          steps.parse.outputs.valid == 'true' &&
          steps.verdict.outputs.verdict == 'needs-human'
        env:
          REASONING_FILE: ${{ steps.verdict.outputs.reasoning_file }}
        run: |
          set -eu
          cp "$REASONING_FILE" "${RUNNER_TEMP}/forensics-handoff/reason.md"
          printf 'route=needs-human\nreason_code=out-of-scope\n' > "${RUNNER_TEMP}/forensics-handoff/route.env"

      # ----------------------------------------------------------------
      # auto-fixable path. The scope check is the FIRST
      # gate; cross-boundary attempts fall through to needs-human before
      # any branch is created.
      # ----------------------------------------------------------------
      - name: Scope check
        id: scope
        if: |
          steps.idempotency.outputs.already_triaged != 'true' &&
          steps.parse.outputs.valid == 'true' &&
          steps.verdict.outputs.verdict == 'auto-fixable'
        env:
          VERDICT_FILE: ${{ steps.verdict.outputs.verdict_file }}
        run: |
          set -eu
          paths_file="${RUNNER_TEMP}/forensics/proposed-paths.txt"
          jq -r '.proposed_paths[]' "$VERDICT_FILE" > "$paths_file"

          # mapfile keeps shell-metacharacter-bearing paths intact (vs
          # word-splitting). Empty array would have been caught by
          # parse-verdict's downgrade-to-ambiguous rule.
          mapfile -t paths < "$paths_file"
          scope_json="${RUNNER_TEMP}/forensics/scope.json"
          "$FORENSICS_DIR/check-scope.sh" "${paths[@]}" > "$scope_json"

          ok="$(jq -r '.ok' "$scope_json")"
          {
            echo "ok=$ok"
            echo "scope_file=$scope_json"
            echo "paths_file=$paths_file"
          } >> "$GITHUB_OUTPUT"

      - name: Route out-of-scope auto-fix
        if: |
          steps.idempotency.outputs.already_triaged != 'true' &&
          steps.parse.outputs.valid == 'true' &&
          steps.verdict.outputs.verdict == 'auto-fixable' &&
          steps.scope.outputs.ok == 'false'
        env:
          REASONING_FILE: ${{ steps.verdict.outputs.reasoning_file }}
          SCOPE_FILE: ${{ steps.scope.outputs.scope_file }}
        run: |
          set -eu
          # Compose a reasoning file that names the offending paths so
          # the maintainer can triage without re-reading the workflow log.
          reason_file="${RUNNER_TEMP}/forensics/scope-reason.md"
          # shellcheck disable=SC2016 # jq filter uses literal interpolation `\(.field)`
          {
            cat "$REASONING_FILE"
            printf '\n\n---\n\nProposed paths rejected by `check-scope.sh`:\n\n'
            jq -r '.denied[] | "- `\(.path)`, \(.reason)"' "$SCOPE_FILE"
          } > "$reason_file"
          cp "$reason_file" "${RUNNER_TEMP}/forensics-handoff/reason.md"
          printf 'route=needs-human\nreason_code=out-of-scope\n' > "${RUNNER_TEMP}/forensics-handoff/route.env"

      # ----------------------------------------------------------------
      # Branch creation + fix application. Only fires when the verdict is
      # `auto-fixable` AND every proposed path is in scope. The Quality
      # Gate runs in its own job.
      # ----------------------------------------------------------------
      - name: Compute branch name
        id: branch
        if: |
          steps.idempotency.outputs.already_triaged != 'true' &&
          steps.parse.outputs.valid == 'true' &&
          steps.verdict.outputs.verdict == 'auto-fixable' &&
          steps.scope.outputs.ok == 'true'
        env:
          PARSED_FILE: ${{ steps.parse.outputs.parsed_file }}
        run: |
          set -eu
          # The branch slug derives from the frontmatter `class` field
          # (one of: init|update|wiki-sync|quality-gate|hook|scaffold|
          # dev-server|other). That keeps branch names predictable and
          # bounded in length, unlike using the issue title.
          class_slug="$(jq -r '.frontmatter.class' "$PARSED_FILE" | tr 'A-Z ' 'a-z-' | tr -cd 'a-z0-9-')"
          [ -z "$class_slug" ] && class_slug="other"
          branch="forensics/${ISSUE_NUMBER}-${class_slug}"
          echo "name=$branch" >> "$GITHUB_OUTPUT"
          echo "class_slug=$class_slug" >> "$GITHUB_OUTPUT"

      - name: Create fix branch from main
        if: |
          steps.idempotency.outputs.already_triaged != 'true' &&
          steps.parse.outputs.valid == 'true' &&
          steps.verdict.outputs.verdict == 'auto-fixable' &&
          steps.scope.outputs.ok == 'true'
        env:
          FIX_BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -eu
          git fetch origin main
          git checkout -B "$FIX_BRANCH" refs/remotes/origin/main
          git config user.name 'gaia-forensics-triage[bot]'
          git config user.email 'gaia-forensics-triage[bot]@users.noreply.github.com'

      - name: Render apply-fix prompt
        id: render-apply
        if: |
          steps.idempotency.outputs.already_triaged != 'true' &&
          steps.parse.outputs.valid == 'true' &&
          steps.verdict.outputs.verdict == 'auto-fixable' &&
          steps.scope.outputs.ok == 'true'
        env:
          PARSED_FILE: ${{ steps.parse.outputs.parsed_file }}
          VERDICT_FILE: ${{ steps.verdict.outputs.verdict_file }}
        run: |
          set -eu

          symptom="$(jq -r '.sections.symptom' "$PARSED_FILE")"
          capture="$(jq -r '.sections.capture' "$PARSED_FILE")"
          repro="$(jq -r '.sections.reproduction_context' "$PARSED_FILE")"
          reasoning="$(jq -r '.reasoning' "$VERDICT_FILE")"

          # Each proposed path on its own line (the prompt fences the
          # block; content is read-back-into-position via a single gsub).
          paths_block="$(jq -r '.proposed_paths[]' "$VERDICT_FILE")"

          # SEC-2: neutralize the untrusted issue sections (backtick runs +
          # injected GAIA-FIX-ABORT/GAIA-VERDICT markers) before substitution.
          symptom="$("$FORENSICS_DIR/neutralize-untrusted.sh" "$symptom")"
          capture="$("$FORENSICS_DIR/neutralize-untrusted.sh" "$capture")"
          repro="$("$FORENSICS_DIR/neutralize-untrusted.sh" "$repro")"

          # SEC-2: per-run random sentinel wrapping each untrusted section.
          SENTINEL="UNTRUSTED_$(openssl rand -hex 12)"

          rendered_file="${RUNNER_TEMP}/forensics/apply-fix-prompt.md"

          "$FORENSICS_DIR/render-prompt.sh" "$FORENSICS_DIR/apply-fix-prompt.md" \
            "ISSUE_NUMBER=$ISSUE_NUMBER" \
            "SENTINEL=$SENTINEL" \
            "PROPOSED_PATHS=$paths_block" \
            "CLASSIFIER_REASONING=$reasoning" \
            "SYMPTOM=$symptom" \
            "CAPTURE=$capture" \
            "REPRO_CONTEXT=$repro" \
            > "$rendered_file"

          delim="EOF_$(openssl rand -hex 16)"
          {
            echo "body<<$delim"
            cat "$rendered_file"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Apply fix (Claude Code Action)
        id: apply-fix
        if: |
          steps.idempotency.outputs.already_triaged != 'true' &&
          steps.parse.outputs.valid == 'true' &&
          steps.verdict.outputs.verdict == 'auto-fixable' &&
          steps.scope.outputs.ok == 'true'
        # Continue on failure: max-turns / SDK / API errors must not strand
        # the issue. The Verify-diff step already routes empty-diff and
        # GAIA-FIX-ABORT to handle-needs-human.sh; an action exit-non-zero
        # demotes cleanly through the same path instead of short-circuiting
        # the rest of the workflow.
        continue-on-error: true
        uses: anthropics/claude-code-action@63322d7b2bc79e7b621b89f41b53ceb8e5a5d314 # v1.0
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Read-only job token and no project hooks; see the classifier.
          github_token: ${{ github.token }}
          settings: '{"disableAllHooks": true}'
          prompt: ${{ steps.render-apply.outputs.body }}
          # File-edit tools only. NO Bash, NO git, NO push tools, NO web.
          # Post-step verification asserts diffs touch only `proposed_paths`.
          # max-turns is 60 because 30 proved too tight on a
          # moderate-complexity fixture; the fix-abort and
          # quality-gate backstops contain runaway behavior.
          claude_args: |
            --max-turns 60
            --allowedTools Edit,Write,Read
            --disallowedTools Bash,WebFetch,WebSearch

      - name: Verify diff against proposed paths
        id: verify-diff
        if: |
          steps.idempotency.outputs.already_triaged != 'true' &&
          steps.parse.outputs.valid == 'true' &&
          steps.verdict.outputs.verdict == 'auto-fixable' &&
          steps.scope.outputs.ok == 'true'
        env:
          APPLY_FIX_EXEC_FILE: ${{ steps.apply-fix.outputs.execution_file }}
          PROPOSED_PATHS_FILE: ${{ steps.scope.outputs.paths_file }}
        run: |
          set -eu

          # set_outputs: emits one or more `key=value` pairs to
          # $GITHUB_OUTPUT in a single block. Lets us collapse repeated
          # write-and-exit branches without losing readability.
          set_outputs() {
            local kv
            for kv in "$@"; do
              printf '%s\n' "$kv"
            done >> "$GITHUB_OUTPUT"
          }

          # Capture the apply-fix execution-file's last `result` entry so we
          # can detect the GAIA-FIX-ABORT escape hatch and surface the
          # rationale to the maintainer. The action emits a top-level
          # JSON array of execution events.
          apply_text="${RUNNER_TEMP}/forensics/apply-fix-text.md"
          if [ -n "$APPLY_FIX_EXEC_FILE" ] && [ -f "$APPLY_FIX_EXEC_FILE" ]; then
            jq -r '[.[] | select(.type == "result")] | .[-1].result // empty' \
              "$APPLY_FIX_EXEC_FILE" > "$apply_text"
          else
            : > "$apply_text"
          fi
          set_outputs "apply_text=$apply_text"

          if grep -qE '^[[:space:]]*GAIA-FIX-ABORT:' "$apply_text"; then
            set_outputs "diff_ok=false" "abort_reason=fix-abort"
            exit 0
          fi

          # Stage edits so `git diff --staged` reflects everything the
          # model touched (including new files and deletions).
          git add -A
          # `.nul`, not `.txt`: the file is NUL-delimited, and its path is also
          # published as a step output, so the extension is the only signal a
          # later consumer has that a plain line-reader would swallow the whole
          # file as one record.
          touched_file="${RUNNER_TEMP}/forensics/touched-paths.nul"
          # NUL-delimited, read back with a matching `mapfile -d ''` below.
          # Without `-z` git C-quotes a path carrying a non-ASCII byte, and
          # check-scope.sh would then be handed `"forensics/caf\303\251.md"`,
          # a literal that matches no scope pattern, so the re-check aborts a
          # legitimate fix instead of clearing it.
          git diff --staged --name-only -z > "$touched_file"
          set_outputs "touched_file=$touched_file"

          if [ ! -s "$touched_file" ]; then
            set_outputs "diff_ok=false" "abort_reason=empty-diff"
            exit 0
          fi

          # Re-run check-scope on the actual touched paths. This is the
          # post-step scope backstop: even if the model lied
          # about its proposed paths, the diff has to clear scope.
          mapfile -d '' -t touched < "$touched_file"
          touched_scope="${RUNNER_TEMP}/forensics/touched-scope.json"
          "$FORENSICS_DIR/check-scope.sh" "${touched[@]}" > "$touched_scope"
          if [ "$(jq -r '.ok' "$touched_scope")" != "true" ]; then
            set_outputs \
              "diff_ok=false" \
              "abort_reason=diff-out-of-scope" \
              "touched_scope=$touched_scope"
            exit 0
          fi

          # Even within scope, the diff must be a SUBSET of the
          # classifier's `proposed_paths`. Any deviation halts before the
          # gate (per task spec step 10's deviation clause).
          # `PROPOSED_PATHS_FILE` is guaranteed populated by the upstream
          # `scope` step; the step's `if:` gate (`scope.outputs.ok ==
          # 'true'`) makes the missing-file branch unreachable, so no
          # explicit `[ -f ... ]` guard is needed here.
          unexpected="${RUNNER_TEMP}/forensics/unexpected-paths.txt"
          : > "$unexpected"
          while IFS= read -r -d '' p; do
            [ -z "$p" ] && continue
            if ! grep -Fxq -- "$p" "$PROPOSED_PATHS_FILE"; then
              printf '%s\n' "$p" >> "$unexpected"
            fi
          done < "$touched_file"

          if [ -s "$unexpected" ]; then
            set_outputs \
              "diff_ok=false" \
              "abort_reason=diff-not-in-proposed" \
              "unexpected_file=$unexpected"
            exit 0
          fi

          set_outputs "diff_ok=true"

      - name: Route apply-fix abort
        if: |
          steps.idempotency.outputs.already_triaged != 'true' &&
          steps.parse.outputs.valid == 'true' &&
          steps.verdict.outputs.verdict == 'auto-fixable' &&
          steps.scope.outputs.ok == 'true' &&
          steps.verify-diff.outputs.diff_ok == 'false'
        env:
          ABORT_REASON: ${{ steps.verify-diff.outputs.abort_reason }}
          REASONING_FILE: ${{ steps.verdict.outputs.reasoning_file }}
          APPLY_TEXT_FILE: ${{ steps.verify-diff.outputs.apply_text }}
          UNEXPECTED_FILE: ${{ steps.verify-diff.outputs.unexpected_file }}
        run: |
          set -eu
          reason_file="${RUNNER_TEMP}/forensics/apply-abort-reason.md"
          # shellcheck disable=SC2016 # awk program references awk's $0
          {
            printf 'auto-fix abort reason: `%s`\n\n' "$ABORT_REASON"
            cat "$REASONING_FILE"
            printf '\n\n---\n\nfix-applier final message:\n\n'
            cat "$APPLY_TEXT_FILE" || true
            if [ -n "$UNEXPECTED_FILE" ] && [ -f "$UNEXPECTED_FILE" ]; then
              printf '\n\nDiff touched paths NOT proposed by the classifier:\n\n'
              awk '{print "- `"$0"`"}' "$UNEXPECTED_FILE"
            fi
          } > "$reason_file"
          # Discard local edits before exiting, the branch was never
          # pushed, but resetting keeps the runner's working tree clean
          # in case any always-run step inspects it.
          git reset --hard HEAD
          # `diff-not-in-proposed` is a deviation (the model
          # touched in-allowlist paths it did not declare upfront), not a
          # scope violation. Other abort reasons remain `out-of-scope`.
          if [ "$ABORT_REASON" = "diff-not-in-proposed" ]; then
            reason_code="deviation"
          else
            reason_code="out-of-scope"
          fi
          cp "$reason_file" "${RUNNER_TEMP}/forensics-handoff/reason.md"
          printf 'route=needs-human\nreason_code=%s\n' "$reason_code" > "${RUNNER_TEMP}/forensics-handoff/route.env"

      # ----------------------------------------------------------------
      # Commit the fix on the local branch and bundle it for the later
      # jobs. Nothing is pushed from this job: the quality-gate job runs
      # the gate and the publish job pushes only on a pass.
      # ----------------------------------------------------------------
      - name: Commit and bundle fix
        id: commit-fix
        if: |
          steps.idempotency.outputs.already_triaged != 'true' &&
          steps.parse.outputs.valid == 'true' &&
          steps.verdict.outputs.verdict == 'auto-fixable' &&
          steps.scope.outputs.ok == 'true' &&
          steps.verify-diff.outputs.diff_ok == 'true'
        env:
          FIX_BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -eu
          # Already `git add -A`'d in verify-diff.
          git commit -m "fix(forensics): auto-fix attempt for #${ISSUE_NUMBER}"
          handoff_dir="${RUNNER_TEMP}/forensics-handoff"
          # The base commit is the bundle's prerequisite and the left side
          # of the quality-gate job's scope re-check.
          git rev-parse refs/remotes/origin/main > "$handoff_dir/base-sha"
          git bundle create "$handoff_dir/fix.bundle" \
            "refs/heads/$FIX_BRANCH" ^refs/remotes/origin/main
          printf 'route=fix-ready\n' > "$handoff_dir/route.env"

      - name: Record route
        id: route
        if: always()
        run: |
          set -eu
          route_file="${RUNNER_TEMP}/forensics-handoff/route.env"
          # No route file means the job failed before reaching an outcome;
          # the publish job then applies only the fail-forward label.
          [ -f "$route_file" ] || exit 0
          route="$(sed -n 's/^route=//p' "$route_file")"
          reason_code="$(sed -n 's/^reason_code=//p' "$route_file")"
          {
            echo "route=$route"
            echo "reason_code=$reason_code"
          } >> "$GITHUB_OUTPUT"

      - name: Upload handoff
        if: always() && steps.route.outputs.route != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: forensics-handoff
          path: ${{ runner.temp }}/forensics-handoff
          retention-days: 5

  # ------------------------------------------------------------------
  # Quality Gate over the fix. Read-only token and no secrets: this is
  # the job that executes model-edited files, so it holds nothing worth
  # taking. The fix commit's paths are re-checked against this
  # checkout's own check-scope.sh before the fix is checked out, so no
  # model-edited file runs unless it is in scope.
  # ------------------------------------------------------------------
  quality-gate:
    name: Quality Gate on the fix
    needs: triage
    if: needs.triage.outputs.route == 'fix-ready'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.quality-gate.outcome }}
    env:
      FORENSICS_DIR: .github/forensics
      FIX_BRANCH: ${{ needs.triage.outputs.fix_branch }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: forensics-handoff
          path: ${{ runner.temp }}/forensics-handoff

      - name: Re-check scope, then check out the fix
        run: |
          set -eu
          handoff_dir="${RUNNER_TEMP}/forensics-handoff"
          base_sha="$(cat "$handoff_dir/base-sha")"
          git fetch "$handoff_dir/fix.bundle" "refs/heads/$FIX_BRANCH:refs/heads/$FIX_BRANCH"
          # NUL-delimited for the reason the triage job's verify-diff step
          # gives: git would otherwise C-quote a non-ASCII path.
          touched_file="${RUNNER_TEMP}/fix-touched-paths.nul"
          git diff --name-only -z "$base_sha" "refs/heads/$FIX_BRANCH" > "$touched_file"
          if [ ! -s "$touched_file" ]; then
            echo "::error::the fix bundle changes no path"
            exit 1
          fi
          mapfile -d '' -t touched < "$touched_file"
          # check-scope.sh runs from this job's checkout of main, not from
          # the fix: the model's edits cannot reach the copy that judges them.
          scope_json="$("$FORENSICS_DIR/check-scope.sh" "${touched[@]}")"
          if [ "$(printf '%s' "$scope_json" | jq -r '.ok')" != "true" ]; then
            echo "::error::the fix touches paths outside the forensics scope: $scope_json"
            exit 1
          fi
          git checkout "$FIX_BRANCH"

      # Node + pnpm are provisioned only in this job, the one consumer of
      # them.
      - name: Setup pnpm
        # Bounds a stalled fetch, not a budget for the work: strictly under
        # the job's own 30-minute cap so this step fires first and the job
        # reds with a step name attached rather than a generic job timeout.
        # See .github/actions/gaia-setup-node/action.yml for this project's
        # broader pnpm-provisioning reasoning.
        timeout-minutes: 5
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # npm's own 300000 ms fetch timeout equals this step's cap, so a hung
        # fetch would red the step before npm retries it; the shared setup
        # action carries the same bound and states why.
        env:
          npm_config_fetch_timeout: '60000'

      - name: Setup Node
        # Bounds a stalled Node tarball fetch, not a budget for the work:
        # strictly under the job's own 30-minute cap so this step fires first
        # and the job reds with a step name attached rather than a generic job
        # timeout.
        timeout-minutes: 3
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'

      - name: Run Quality Gate
        id: quality-gate
        continue-on-error: true
        run: |
          set -eu
          mkdir -p "${RUNNER_TEMP}/forensics-gate"
          "$FORENSICS_DIR/run-quality-gate.sh" "${RUNNER_TEMP}/forensics-gate/gate-summary.json"

      - name: Upload gate summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: forensics-gate-summary
          path: ${{ runner.temp }}/forensics-gate
          retention-days: 5
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # Publish. The only job with write permissions; GH_TOKEN is set on
  # the steps that call GitHub, never job-wide. It reads the handoff,
  # runs the handler for the route, and on a gate pass pushes the fix
  # branch straight from the bundle. It never checks out the fix, so
  # no model-edited file runs here.
  # ------------------------------------------------------------------
  publish:
    name: Report triage outcome
    needs: [triage, quality-gate]
    if: always() && needs.triage.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      FORENSICS_DIR: .github/forensics
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The bundle's prerequisite is a main commit, so the full history
          # is needed to fetch from it.
          fetch-depth: 0
          persist-credentials: false

      - name: Download handoff
        if: needs.triage.outputs.route != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: forensics-handoff
          path: ${{ runner.temp }}/forensics-handoff

      - name: Handle already-triaged
        if: needs.triage.outputs.route == 'already-triaged'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          "$FORENSICS_DIR/handlers/handle-already-triaged.sh" "$ISSUE_NUMBER"

      - name: Handle malformed body
        if: needs.triage.outputs.route == 'malformed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          "$FORENSICS_DIR/handlers/handle-malformed-body.sh" \
            "$ISSUE_NUMBER" \
            "${RUNNER_TEMP}/forensics-handoff/parsed.json"

      - name: Handle non-issue
        if: needs.triage.outputs.route == 'non-issue'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          "$FORENSICS_DIR/handlers/handle-non-issue.sh" \
            "$ISSUE_NUMBER" \
            "${RUNNER_TEMP}/forensics-handoff/reasoning.md"

      - name: Handle needs-human
        if: needs.triage.outputs.route == 'needs-human'
        env:
          GH_TOKEN: ${{ github.token }}
          REASON_CODE: ${{ needs.triage.outputs.reason_code }}
        run: |
          set -eu
          "$FORENSICS_DIR/handlers/handle-needs-human.sh" \
            "$ISSUE_NUMBER" \
            "${RUNNER_TEMP}/forensics-handoff/reason.md" \
            "$REASON_CODE"

      - name: Download gate summary
        if: needs.triage.outputs.route == 'fix-ready' && needs.quality-gate.outputs.outcome != 'success'
        # Absent when the gate job failed before the gate ran; the failure
        # comment says so instead of stranding the issue.
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: forensics-gate-summary
          path: ${{ runner.temp }}/forensics-gate

      # A gate job that failed before the gate step ran reports no outcome,
      # which reads as a failure here, never as a pass.
      - name: Handle Quality Gate failure
        if: needs.triage.outputs.route == 'fix-ready' && needs.quality-gate.outputs.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # The branch is never pushed, so there is nothing to clean up on
          # origin. Compose the comment, demote.
          gate_summary_file="${RUNNER_TEMP}/forensics-gate/gate-summary.json"
          reason_file="${RUNNER_TEMP}/gate-failure-reason.md"
          # shellcheck disable=SC2016 # jq filters are intentionally single-quoted
          {
            cat "${RUNNER_TEMP}/forensics-handoff/reasoning.md"
            printf '\n\n---\n\nQuality Gate failure summary:\n\n'
            if [ -f "$gate_summary_file" ]; then
              failed_step="$(jq -r '.failed_step // "unknown"' "$gate_summary_file")"
              exit_code="$(jq -r '.exit_code // "unknown"' "$gate_summary_file")"
              printf 'failed step: `%s` (exit %s)\n\n' "$failed_step" "$exit_code"
              printf 'log excerpt:\n\n```\n'
              jq -r '.log_excerpt // ""' "$gate_summary_file"
              printf '\n```\n\n'
            else
              printf '_(gate summary file missing, see workflow run logs)_\n\n'
            fi
            printf 'workflow run: %s/%s/actions/runs/%s\n' \
              "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}"
          } > "$reason_file"
          "$FORENSICS_DIR/handlers/handle-needs-human.sh" \
            "$ISSUE_NUMBER" \
            "$reason_file" \
            "gate-failure"

      # ----------------------------------------------------------------
      # Gate passed → push branch and open draft PR. Gated on the gate
      # job's outcome being `success`, so a failing gate never pushes,
      # by construction.
      # ----------------------------------------------------------------
      - name: Push fix branch
        if: needs.triage.outputs.route == 'fix-ready' && needs.quality-gate.outputs.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          FIX_BRANCH: ${{ needs.triage.outputs.fix_branch }}
        run: |
          set -eu
          git fetch "${RUNNER_TEMP}/forensics-handoff/fix.bundle" \
            "refs/heads/$FIX_BRANCH:refs/heads/$FIX_BRANCH"
          # The credential rides on this one command, the same header
          # actions/checkout would have persisted; nothing is written to
          # .git/config.
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth_header"
          git -c "http.https://github.com/.extraheader=$auth_header" \
            push origin "refs/heads/$FIX_BRANCH:refs/heads/$FIX_BRANCH"

      - name: Compose PR body
        id: pr-body
        if: needs.triage.outputs.route == 'fix-ready' && needs.quality-gate.outputs.outcome == 'success'
        run: |
          set -eu
          # `## Capture` is passed through verbatim. No
          # re-redaction, no de-redaction, no normalization. The parsed
          # JSON's `.sections.capture` field is the byte-for-byte content
          # the body parser pulled from the issue (modulo the at-most-one
          # leading/trailing blank line trim documented in
          # parse-issue-body.sh).
          handoff_dir="${RUNNER_TEMP}/forensics-handoff"
          body_file="${RUNNER_TEMP}/pr-body.md"
          # shellcheck disable=SC2016 # markdown literals contain backticks; jq filter is single-quoted
          {
            printf 'Auto-fix attempt for issue #%s.\n\n' "$ISSUE_NUMBER"
            printf 'Closes #%s\n\n' "$ISSUE_NUMBER"
            printf -- '---\n\n'
            printf '## Capture (verbatim from issue)\n\n'
            jq -r '.sections.capture' "$handoff_dir/parsed.json"
            printf '\n\n---\n\n'
            printf '## Classifier reasoning\n\n'
            cat "$handoff_dir/reasoning.md"
            printf '\n\n---\n\n'
            printf '_Draft PR. Branch protection on `main` requires human review before merge._\n'
          } > "$body_file"
          echo "file=$body_file" >> "$GITHUB_OUTPUT"

      - name: Open draft PR + finalize labels
        if: needs.triage.outputs.route == 'fix-ready' && needs.quality-gate.outputs.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          FIX_BRANCH: ${{ needs.triage.outputs.fix_branch }}
          FIX_CLASS_SLUG: ${{ needs.triage.outputs.class_slug }}
          PR_BODY_FILE: ${{ steps.pr-body.outputs.file }}
        run: |
          set -eu
          "$FORENSICS_DIR/handlers/handle-auto-fixable.sh" \
            "$ISSUE_NUMBER" \
            "$FIX_CLASS_SLUG" \
            "$FIX_BRANCH" \
            "$PR_BODY_FILE"

      # ----------------------------------------------------------------
      # Fail-forward: if the workflow did meaningful work but
      # bombed before any handler attached `gaia-triaged`, this final
      # always-run step ensures the idempotency key sticks. The
      # already-triaged route's handler applies the label itself, so the
      # fallback skips it.
      # ----------------------------------------------------------------
      - name: Ensure gaia-triaged is applied (fail-forward)
        if: always() && needs.triage.outputs.route != 'already-triaged'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh issue edit "$ISSUE_NUMBER" --add-label gaia-triaged || true
