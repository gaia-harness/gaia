name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default-deny, so a job added later inherits no scope rather than the
# repository default. Each job below grants exactly what it needs.
permissions: {}

jobs:
  tests:
    name: Vitest and Playwright
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    # 25 minutes bounds execution: a job that hits the cap is cancelled and
    # reports an ordinary red check to re-run rather than hanging. A full run
    # here is a few minutes: typecheck, lint, Vitest and Playwright (which
    # includes the per-story dark a11y scan over the built Storybook, one
    # worker per core). On CI each broken story costs about 3.5 minutes across
    # its retries, so the cap leaves room for a few broken stories to report
    # in full even when the system-dependency install below spends most of
    # its own 10-minute bound on a slow apt mirror. The browser install below
    # fetches one engine rather than every engine Playwright ships.
    timeout-minutes: 25
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `checks: read` lets resolve-check-base.sh query prior commits' check-runs
      # to find the last commit this check passed on (incremental scope).
      checks: read
    env:
      # Fallback placeholders let PRs from forks (which can't read repo secrets) still run the suite.
      # MSW intercepts outbound HTTP so the real API_URL is not needed; SESSION_SECRET just needs to be non-empty.
      API_URL: ${{ secrets.API_URL || 'http://localhost:3000/api' }}
      MSW_ENABLED: ${{ secrets.MSW_ENABLED || 'true' }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET || 'ci-placeholder-session-secret-not-real' }}
      SITE_URL: ${{ secrets.SITE_URL || 'http://localhost:3000' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Pre-verified dep-bump PRs (the /update-deps wrapper runs the full
      # quality gate locally before pushing) skip the CI suite, but only when
      # the dep-bump title is matched AND the PR's diff is confined to
      # dependency manifests; otherwise the incremental filter below decides
      # as for any other PR. Skipped jobs do not satisfy required checks under
      # classic branch protection, so we gate steps instead.
      - name: Check chore-deps title
        id: chore-deps
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if changed=$(set -o pipefail; git diff --name-only -z --no-renames "${PR_BASE_SHA}...HEAD" | tr '\0' '\n'); then
              skip="$(bash .gaia/scripts/chore-deps-skip.sh "$PR_TITLE" <<<"$changed")"
            else
              skip=false
            fi
            # An msw bump regenerates the committed worker script, which only
            # the test suite checks, so a manifest-only msw change never skips.
            # An unreadable diff leaves skip as set above; a grep miss must not
            # abort the step under set -e.
            if [ "$skip" = "true" ] && msw_diff=$(git diff --no-renames "${PR_BASE_SHA}...HEAD" -- '*package.json') && printf '%s\n' "$msw_diff" | grep -qE '^[+-][[:space:]]*"msw":'; then
              skip=false
            fi
          else
            skip=false
          fi
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"
      # Incremental scope: resolve the most recent ancestor of HEAD on which
      # "Vitest and Playwright" already passed, then gate the suite on whether
      # the delta SINCE that green run touches a test-relevant file. A code
      # commit that passes followed by a prose-only commit reviews an empty
      # relevant delta and skips. Falls back to `refs/remotes/origin/main` (full
      # scope) when no green ancestor exists, first run, prior runs
      # failed/cancelled, or the API is unreachable (e.g. fork PRs without a
      # token); the helper hardcodes that literal rather than deriving a default
      # branch. Skipped jobs do not satisfy required checks under branch
      # protection, so we gate steps.
      - name: Resolve last-green base
        id: base
        if: steps.chore-deps.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          base="$(bash .github/audit/resolve-check-base.sh 'Vitest and Playwright' || echo refs/remotes/origin/main)"
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          echo "tests: incremental base = ${base}" >&2
      # Allowlist of paths that affect the test suite (ERE, matched against
      # `git diff --name-only`). The app lives in
      # `frontend/`, so its entries carry that prefix while the one
      # workspace lockfile and manifests stay at the root; the two
      # `gaia.package.json`/`packages.json` entries are the package registry
      # and descriptor the harness reads. Anything outside this list reports the
      # required check green without running, so a path that carries tests
      # must appear here: `frontend/.playwright/` holds the e2e specs and their
      # helpers, which `playwright.config.` alone does not cover.
      # This job also runs typecheck and lint, so a path those cover belongs
      # here too even when it carries no tests: `frontend/.storybook/` holds neither
      # tests nor stories, but it is inside the tsconfig `include` and is
      # linted, and Chromatic's Vite build strips types instead of checking
      # them, so it is not a substitute. The `*.config.*` alternation names
      # every frontend/ config for the same reason, not only the four whose tools
      # this job runs: each one is linted, the `.ts` ones are also in the
      # tsconfig program (the `.mjs` ones are not, since `include` lists no
      # `.mjs` glob and `allowJs` is off), and `react-router.config.` feeds the
      # typegen step that runs before `tsc`. `pnpm-workspace.yaml` and `.npmrc`
      # are here because pnpm 11 reads install behavior from them that the
      # lockfile's own `settings:` block does not carry, so a change to either
      # can break `--frozen-lockfile` for the next unrelated PR.
      - name: Detect test-relevant changes in the incremental delta
        id: filter
        if: steps.chore-deps.outputs.skip == 'false'
        env:
          CHECK_BASE: ${{ steps.base.outputs.base }}
        run: |
          set -eu
          # -z, so a non-ASCII path is not C-quoted into a string the ERE below
          # cannot match: without it a change under frontend/app/ can read as no relevant
          # change at all, and this step reports the required check green having
          # run no tests. `$(...)` discards NUL bytes, so the `tr` must stay
          # inside the substitution; the subshell sets pipefail so a git failure
          # still aborts the step under `set -e` as it did before the pipe.
          # --no-renames, so a file moved out of frontend/app/ lists its old path too:
          # rename detection reports only the new path, and a move to docs/
          # would read as no relevant change while its importers break.
          # The root-level dev-ports modules are imported by vite.config.ts and
          # playwright.config.ts, so a change to one is test-relevant too.
          # The committed msw worker script is read by the node-project drift
          # test, so a change to it alone is test-relevant.
          # The apt archive cache action installs Chromium's system
          # dependencies for this job, so a change to it must run the job.
          changed=$(set -o pipefail; git diff --name-only -z --no-renames "${CHECK_BASE}...HEAD" | tr '\0' '\n')
          pattern='^frontend/(app|test)/|^frontend/\.playwright/|^frontend/\.storybook/|^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.npmrc|\.node-version)$|^frontend/package\.json$|^frontend/tsconfig[^/]*\.json$|^frontend/dev-ports[^/]*\.ts$|^frontend/components\.json$|^frontend/(vite|vitest|playwright|eslint|react-router|react-compiler|doctor|knip|prettier|stylelint)\.config\.|^\.gaia/packages\.json$|^frontend/gaia\.package\.json$|^frontend/public/mockServiceWorker\.js$|^\.github/workflows/tests\.yml$|^\.github/actions/gaia-apt-cache/'
          if printf '%s\n' "$changed" | grep -qE "$pattern"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.chore-deps.outputs.skip == 'false' && steps.filter.outputs.code == 'true'
        name: Setup Node and install
        uses: ./.github/actions/gaia-setup-node
      # Reads the version inline rather than through a Marketplace action. The
      # Marketplace option here is a CONTAINER action, and GitHub builds a
      # container action's image during job setup, before any step-level `if:`
      # can gate it off. That cost is paid on entering the job rather than on
      # reaching the step, so it is not avoided even on a run where every step
      # below gets filtered out and nothing else runs at all.
      #
      # Same step id and same `current-version` output name, so the two
      # `npm_package_version:` consumers below (Vitest, Playwright) read
      # unchanged. `jq` is preinstalled on GitHub-hosted runners.
      #
      # Captured into a variable first, and `jq -e` so a null or absent
      # `.version` is an error rather than the string "null". Interpolating the
      # substitution straight into the `echo` would make `echo` the command
      # whose status the step reports, so a jq that could not read the file, or
      # a runner image without jq at all, would write an empty version and pass
      # green: the two suites below would then run under an empty
      # `npm_package_version` with nothing red to say so.
      - if: steps.chore-deps.outputs.skip == 'false' && steps.filter.outputs.code == 'true'
        name: get-npm-version
        id: package-version
        run: |
          set -euo pipefail
          version="$(jq -er .version package.json)"
          echo "current-version=${version}" >> "$GITHUB_OUTPUT"
      - if: steps.chore-deps.outputs.skip == 'false' && steps.filter.outputs.code == 'true'
        name: Typecheck
        run: pnpm typecheck
      - if: steps.chore-deps.outputs.skip == 'false' && steps.filter.outputs.code == 'true'
        name: Lint
        run: pnpm lint-dry
      # Only the engine the suites run. Vitest's browser and storybook projects
      # and the Playwright story scan all launch Chromium, so this one install
      # serves both steps below and must precede the first of them. `playwright install` resolves its browser
      # set from its arguments alone and reads nothing from playwright.config.ts,
      # so with none named it adds firefox and webkit on top of what this suite
      # needs, for a config whose CI project list is chromium alone (its
      # `otherBrowsers` are gated on `!CI`). Naming chromium still installs the
      # pair a headless run needs, the browser and chromium-headless-shell, plus
      # ffmpeg, so this is the whole requirement rather than a trimmed-down one:
      # firefox and webkit are the entire saving. Adding a CI project for another
      # engine means naming that engine here too, or the run fails on a missing
      # browser.
      #
      # Caching ~/.cache/ms-playwright is deliberately not done: Playwright's CI
      # guide advises against it because restoring the cache costs about what
      # downloading the binaries does. The system libraries and fonts Chromium
      # needs are a different matter: they come from the runner's Ubuntu apt
      # mirror, which can serve a few tens of kB/s for minutes, so the three
      # steps below cache the .deb archives instead and install them offline
      # on a later run of the same pull request.
      #
      # The browser binary and its system dependencies install separately
      # (`install chromium` plus `install-deps chromium`, the two halves of
      # `install --with-deps chromium`), so only the apt half goes through the
      # cache and its bounds. The fonts stay: the e2e and visual suites render
      # text, so dropping them is not this workflow's call.
      - if: steps.chore-deps.outputs.skip == 'false' && steps.filter.outputs.code == 'true'
        name: Read the Playwright version
        id: playwright-version
        run: |
          set -euo pipefail
          version="$(pnpm -C frontend exec playwright --version)"
          version="${version#Version }"
          case "$version" in
            '' | *[!0-9A-Za-z.-]*) echo "::error::could not read the Playwright version, got '${version}'"; exit 1 ;;
          esac
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - if: steps.chore-deps.outputs.skip == 'false' && steps.filter.outputs.code == 'true'
        name: Restore the Playwright system dependency archives
        id: apt-cache
        uses: ./.github/actions/gaia-apt-cache
        with:
          name: playwright-chromium
          request: playwright install-deps chromium
          version: ${{ steps.playwright-version.outputs.version }}
      # Bounds: `install-deps` runs its own `apt-get update` inside the one
      # bounded call, so each attempt is a single 180s call. 180s fits the
      # healthy-mirror install (well under a minute) several times over, and
      # every .deb an attempt finishes stays in the archive directory, so a
      # slow mirror spends three attempts on one download rather than three
      # restarts. 3 x 180 of apt plus 30 of backoff is 570s, inside this
      # step's 10 minutes, so the third cold attempt is reachable. A warm
      # archive directory first runs one offline install under its own 180s
      # bound, so the worst case is 750s, and the third cold attempt is
      # reachable inside this cap only when the warm attempt fails fast. A warm
      # run that succeeds never contacts the mirror.
      - if: steps.chore-deps.outputs.skip == 'false' && steps.filter.outputs.code == 'true'
        name: Install Playwright system dependencies
        timeout-minutes: 10
        env:
          ARCHIVE_DIRECTORY: ${{ steps.apt-cache.outputs.directory }}
        run: >-
          bash .github/actions/gaia-apt-cache/apt-cached-install.sh
          --archive-dir "$ARCHIVE_DIRECTORY" --update-seconds 0 --install-seconds 180 --attempts 3
          -- node frontend/node_modules/playwright/cli.js install-deps chromium
      - if: steps.chore-deps.outputs.skip == 'false' && steps.filter.outputs.code == 'true'
        name: Install Playwright Browsers
        run: pnpm -C frontend exec playwright install chromium
      - if: steps.chore-deps.outputs.skip == 'false' && steps.filter.outputs.code == 'true'
        name: Run Vitest tests
        run: pnpm test:ci
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          npm_package_version: ${{ steps.package-version.outputs.current-version}}
      # The story a11y scan serves this build (`storybook-static/`) and fails,
      # never skips, when it is absent.
      - if: steps.chore-deps.outputs.skip == 'false' && steps.filter.outputs.code == 'true'
        name: Build Storybook
        run: pnpm -C frontend build-storybook
      - if: steps.chore-deps.outputs.skip == 'false' && steps.filter.outputs.code == 'true'
        name: Run Playwright tests
        run: pnpm -C frontend exec playwright test --pass-with-no-tests
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          npm_package_version: ${{ steps.package-version.outputs.current-version}}
      - if: ${{ (failure() || cancelled()) && steps.chore-deps.outputs.skip == 'false' && steps.filter.outputs.code == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        name: Upload Playwright failed test traces
        with:
          name: playwright-traces
          path: frontend/.playwright/output
          retention-days: 5

  # Lints the shell a pull request changes and runs the project's bats suite
  # when shell changed. It has no paths filter so it always reports, which is
  # what lets it be a required check; with nothing to do it exits green from
  # its first step, before any checkout or install. The selection rules, the
  # `"shellcheck": false` opt-out in .gaia/project.json and the GAIA-update
  # owned-file skip live in .gaia/scripts/shell-checks-select.sh.
  shell:
    name: Shellcheck and bats
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # The changed-files list comes from the pull request files endpoint.
      pull-requests: read
    steps:
      # No checkout yet: the selector itself and every input it reads come
      # through the API, so a pull request without shell never pays for a
      # checkout. It lints the whole pull request's selection on every push,
      # not the push's own delta: the check is required per head commit, so a
      # narrower lint would let a head pass while an earlier push's failing
      # file is still in the pull request.
      - name: Select shell to check
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          CHANGED_FILE_COUNT: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          selector="$RUNNER_TEMP/shell-checks-select.sh"
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$REPOSITORY/contents/.gaia/scripts/shell-checks-select.sh?ref=$HEAD_SHA" > "$selector"
          arguments=(plan --repository "$REPOSITORY" --head-sha "$HEAD_SHA" --output-directory "$RUNNER_TEMP/shell-checks")
          if [ -n "$PULL_REQUEST" ]; then
            arguments+=(--pull-request "$PULL_REQUEST" --base-sha "$BASE_SHA" --changed-file-count "$CHANGED_FILE_COUNT")
          fi
          plan="$(bash "$selector" "${arguments[@]}")"
          printf '%s\n' "$plan" | tee -a "$GITHUB_OUTPUT"
          {
            delimiter="patterns_$(openssl rand -hex 16)"
            echo "sparse_patterns<<$delimiter"
            cat "$RUNNER_TEMP/shell-checks/sparse-patterns"
            echo "/.gaia/scripts/shell-checks-lint.sh"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
      - if: steps.select.outputs.checkout == 'sparse'
        name: Check out the selected files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout: ${{ steps.select.outputs.sparse_patterns }}
          sparse-checkout-cone-mode: false
      - if: steps.select.outputs.checkout == 'full'
        name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # A pinned release binary rather than the runner image's shellcheck,
      # which varies with the image. The digest is pinned as well as the
      # version: a release tag is mutable, so the tarball is verified before it
      # is extracted and never piped straight into `tar`. The selector reads
      # SHELLCHECK_VERSION from this file to lint everything when it changes.
      - if: steps.select.outputs.lint != 'none'
        name: Install shellcheck (pinned and digest-verified)
        env:
          SHELLCHECK_VERSION: '0.11.0'
          SHELLCHECK_SHA256: '8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198'
        run: |
          set -euo pipefail
          url="https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL "$url" -o "$RUNNER_TEMP/shellcheck.tar.xz"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
      - if: steps.select.outputs.lint == 'changed'
        name: Shellcheck the changed shell
        run: bash .gaia/scripts/shell-checks-lint.sh --root . < "$RUNNER_TEMP/shell-checks/lint-paths"
      - if: steps.select.outputs.lint == 'full'
        name: Shellcheck every shell file
        run: |
          set -euo pipefail
          git ls-files -z -- '*.sh' '*.bats' \
            | bash .gaia/scripts/shell-checks-select.sh filter --owned "$RUNNER_TEMP/shell-checks/owned" \
            | bash .gaia/scripts/shell-checks-lint.sh --root .
      # Only the pinned bats, not the workspace install: the suite needs the
      # runner and nothing else, and the root package.json pin is the version
      # `pnpm test:shell` resolves locally.
      - if: steps.select.outputs.bats == 'true'
        name: Install bats
        run: |
          set -euo pipefail
          version="$(jq -r '.devDependencies.bats // .dependencies.bats // empty' package.json)"
          [ -n "$version" ] || { echo "tests/shell holds bats suites but package.json pins no bats" >&2; exit 1; }
          npm install --global --prefix "$RUNNER_TEMP/bats" --no-audit --no-fund "bats@$version"
          echo "$RUNNER_TEMP/bats/bin" >> "$GITHUB_PATH"
      - if: steps.select.outputs.bats == 'true'
        name: Run the bats suites
        run: corepack pnpm test:shell
